[package]
name = "backend"
version = "2026.8.11"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54", features = ["full"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "sqlite-bundled", "postgres", "any", "macros", "migrate", "chrono", "uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs"] }
dotenvy = "0.15.7"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
axum-extra = { version = "0.12.6", features = ["multipart", "cookie"] }
cookie = "0.18.2"
dashmap = "6.2.1"
dialoguer = "0.12.0"
futures-util = "0.3.34"
image = "0.25.10"
reqwest = { version = "0.13.5", features = ["json", "stream", "multipart"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
rand = "0.10.3"
subtle = "2.6.1"
url = "2.5.8"
schemars = "1.2.3"
aes = "0.9.4"
base64 = "0.23.1"
cbc = "0.2.1"
cipher = "0.5.2"
hmac = "0.13.0"
pbkdf2 = "0.13.0"
sha2 = "0.11.1"
rmcp = { version = "3.10.0", features = ["server", "transport-io", "macros", "schemars"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[[bin]]
name = "backend"
path = "src/main.rs"
test = false

[[bin]]
name = "local_bench"
path = "src/bin/local_bench.rs"
test = false

[[bin]]
name = "ops_bench"
path = "src/bin/ops_bench.rs"
test = false

[[bin]]
name = "ws_bench"
path = "src/bin/ws_bench.rs"
test = false

[[bin]]
name = "oc"
path = "src/bin/oc.rs"
test = false
